org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled for build reliability on this
# machine. The relocated build directory (android/build.gradle.kts redirects
# output to D:\ridesync\build) combined with Kotlin's memory-mapped incremental
# caches (.tab files) caused "Could not close incremental caches" failures when
# compiling the Firebase plugins. Full (non-incremental) compilation is
# deterministic and correct; the cost is a slightly slower rebuild, an
# acceptable trade for a stable, reproducible build.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
